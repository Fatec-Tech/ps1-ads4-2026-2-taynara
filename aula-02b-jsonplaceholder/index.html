<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários e Posts — JSONPlaceholder</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <div class="container">
      <h1>Usuários</h1>
      <p class="mb-0">Escolha uma pessoa para ler o que ela publicou.</p>
    </div>
  </header>

  <div class="container py-4">

    <div id="area-busca" class="mb-3">
      <input
        type="text"
        id="campo-busca"
        class="form-control form-control-lg"
        placeholder="Buscar usuário por nome..."
      >
    </div>

    <p id="carregando" class="text-muted">Carregando usuários...</p>

    <div id="tela-lista" class="list-group"></div>

    <div id="tela-detalhe" class="d-none">
      <button id="btn-voltar" class="btn btn-voltar mb-3">← Voltar</button>
      <h2 id="detalhe-nome" class="h3 mb-2"></h2>

      <p id="contagem-posts" class="text-muted mb-3"></p>

      <ul id="lista-posts" class="list-group"></ul>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
