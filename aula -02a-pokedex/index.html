<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pokédex API- Taynara</title>
 
		<!-- Bootstrap 5 CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<!-- Fonte do título (opcional): se não carregar, usa a fonte padrão -->
		<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />
 
		<style>
			
			:root {
				--navy: #0b2a4a;        
				--azul: #1e6fd9;        
				--ciano: #38bdf8;      
				--azul-claro: #e8f1fc;  
				--fundo: #f1f6fc;       
			}
 
			body {
				background: var(--fundo);
			}
 
			/* ----- Cabeçalho ----- */
			.topo {
				background: linear-gradient(135deg, var(--navy), var(--azul));
				color: #fff;
				padding: 3rem 0 3.5rem;
			}
			.topo h1 {
				font-family: 'Fredoka', system-ui, sans-serif;
				font-weight: 600;
				font-size: 3.5rem;
				letter-spacing: 1px;
			}
			.topo p {
				color: #bfdcff;
			}
			#searchBtn {
				background: var(--ciano);
				border-color: var(--ciano);
				color: var(--navy);
				font-weight: 600;
			}
			#searchBtn:hover {
				background: #7dd3fc;
				border-color: #7dd3fc;
			}
 
			/* ----- Spinner ----- */
			.spinner-border {
				color: var(--azul);
			}
 
			/* ----- Cards ----- */
			.pokemon-card {
				border: 0 !important;
				border-top: 4px solid var(--azul) !important;
				transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
			}
			.pokemon-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 0.75rem 1.5rem rgba(30, 111, 217, 0.25) !important;
			}
			.pokemon-card .bg-white {
				background: var(--azul-claro) !important;
			}
			.badge-type {
				text-transform: capitalize;
				margin-right: 4px;
				background: var(--navy);
				color: #fff;
			}
 
			/* ----- Modal ----- */
			#pokemonModal .modal-header {
				background: var(--navy);
				color: #fff;
			}
			#pokemonModalBody h6 {
				color: var(--navy);
				font-weight: 700;
			}
			.sprites-box {
				background: var(--azul-claro);
				border-radius: 0.75rem;
			}
			.progress {
				background: #dbe7f6;
			}
			.bar-azul {
				background: linear-gradient(90deg, var(--azul), var(--ciano));
			}
			.badge-habilidade {
				background: var(--azul);
				color: #fff;
			}
		</style>
	</head>
	<body>
		<!-- Cabeçalho com busca -->
		<header class="topo text-center">
			<div class="container">
				<h1>Pokédex</h1>
				<p class="lead mb-4">
					Escolha um Pokémon e descubra seus poderes
				</p>
 
				<div class="row justify-content-center">
					<div class="col-md-6">
						<div class="input-group input-group-lg">
							<input
								type="text"
								id="searchInput"
								class="form-control"
								placeholder="Buscar por nome (ex: pikachu, charizard)..."
							/>
							<button class="btn" type="button" id="searchBtn">
								Buscar
							</button>
						</div>
					</div>
				</div>
			</div>
		</header>
 
		<div class="container py-5">
			<!-- Spinner de Carregamento -->
			<div id="loading" class="text-center my-5 d-none">
				<div
					class="spinner-border"
					role="status"
					style="width: 3rem; height: 3rem"
				>
					<span class="visually-hidden">Carregando...</span>
				</div>
			</div>
 
			<!-- Grid onde as cartas dos Pokémon serão inseridas -->
			<div
				class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
				id="pokemonGrid"
			></div>
		</div>
 
		<!-- Modal de Detalhes -->
		<div class="modal fade" id="pokemonModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content border-0">
					<div class="modal-header">
						<h5 class="modal-title text-capitalize" id="pokemonModalTitle">Detalhes</h5>
						<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
					</div>
					<div class="modal-body" id="pokemonModalBody">
						<!-- Conteúdo inserido dinamicamente via JS -->
					</div>
				</div>
			</div>
		</div>
 
		<!-- JavaScript do Bootstrap -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
		
		<script src="js/app.js"></script>
	</body>
</html>
