<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pacientes</title>

  <!-- Bootstrap via CDN, apenas para estilização básica -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-4">Cadastro de Pacientes</h1>

    <!-- Formulário de cadastro -->
    <form id="form-paciente" class="row g-3 mb-5">
      <div class="col-md-4">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>

      <div class="col-md-4">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="col-md-4">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="telefone" class="form-control" id="tel" required>
      </div>

      <div class="col-md-3">
        <label for="nascimento" class="form-label">Data de nascimento</label>
        <input type="date" class="form-control" id="nascimento" required>
      </div>

      <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">+</button>
      </div>
    </form>
    <!-- Busca --> 
    <div class="mb-3"> 
    <label for="busca" class="form-label">Buscar paciente</label> 
    <input type="text" class="form-control" id="busca" placeholder="Digite o nome do paciente" >
   </div>
    
    <!--Contador de Pacientes-->
    <h4 id="contador-pacientes">Total de pacientes: 0</h4>

     <!-- Tabela de pacientes -->
    <h2 class="h4 mb-3">Pacientes cadastrados</h2>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Telefone</th>
          <th>Data de nascimento</th>
          <th>Idade</th>
        </tr>
      </thead>
      <tbody id="tabela-pacientes">
        <!-- Linhas geradas dinamicamente via JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
